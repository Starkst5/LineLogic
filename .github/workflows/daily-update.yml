name: Daily NBA Data Update

on:
  schedule:
    - cron: '0 8 * * *'  # runs every day at 8am UTC
  workflow_dispatch:  # allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Kaggle
        run: pip install kaggle

      - name: Download Kaggle dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d eoinamoore/historical-nba-data-and-player-box-scores --unzip -p ./data

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd NBADataAnalysisTool-main/DataAnalysis-project/server
          npm install

      - name: Run data update
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: 5432
          PGSSLMODE: require
        run: |
          cd NBADataAnalysisTool-main/DataAnalysis-project/server
          node scripts/loadCSVs.js
