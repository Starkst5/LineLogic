version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd NBADataAnalysisTool-main/DataAnalysis-project && npm install
    build:
      commands:
        - npm run build --prefix NBADataAnalysisTool-main/DataAnalysis-project -- --skipTypeCheck
  artifacts:
    baseDirectory: NBADataAnalysisTool-main/DataAnalysis-project/dist
    files:
      - '**/*'
  cache:
    paths:
      - NBADataAnalysisTool-main/DataAnalysis-project/node_modules/**/*