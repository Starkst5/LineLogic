version: 1
frontend:
  phases:
    preBuild:
      commands:
        - PROJECT_DIR="$PWD/NBADataAnalysisTool-main/DataAnalysis-project" && cd "$PROJECT_DIR" && npm install
    build:
      commands:
        - PROJECT_DIR="$PWD/NBADataAnalysisTool-main/DataAnalysis-project" && cd "$PROJECT_DIR" && npm run build
  artifacts:
    baseDirectory: NBADataAnalysisTool-main/DataAnalysis-project/dist
    files:
      - '**/*'
  cache:
    paths:
      - NBADataAnalysisTool-main/DataAnalysis-project/node_modules/**/*
